name: Build containers

on:
  push:
    branches: [containerrebuild] #change this to the branch you want to trigger the workflow on
    paths:
      - "docker/**"
      - ".github/workflows/build-containers.yml"
      - ".github/scripts/bake_matrix.py"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated bake targets (e.g. fampnn-rocm,boltz2-cuda) or "all"'
        default: all

permissions:
  contents: read
  packages: write

jobs:
  # Lists the bake targets whose Dockerfile (or shared files) changed, so unrelated images aren't rebuilt.
  plan:
    name: Plan builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/bake_matrix.py

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GPU images are large; hosted runners start with little free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry cache avoids the 10 GB GitHub Actions cache limit.
      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          workdir: docker
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/proteindj/cache:${{ matrix.target }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/proteindj/cache:${{ matrix.target }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Free space before testing
        run: |
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h /

      # CPU-only import and --help checks; GPU runs are tested on the cluster.
      - name: Smoke test ${{ matrix.image }}
        run: |
          docker pull "${{ matrix.image }}"
          docker run --rm "${{ matrix.image }}" bash /opt/smoke/smoke_test.sh
